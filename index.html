                                    bankMandiri: activeBankMandiri ? activeBankMandiri.account : INSTITUTION_INFO.bankMandiri,
                                    qrisMerchant: data.paymentGateway.qrisLabel || INSTITUTION_INFO.qrisMerchant
                                });
                            }
                        } else {
                            await saveToBackend();
                        }
                    } catch (e) {
                        console.error('Backend unavailable, using local data', e);
                    } finally {
                        backendInitialized.current = true;
                    }
                }
                loadData();
            }, []);

            useEffect(() => {
                if (!backendInitialized.current) return;
                const timer = setTimeout(() => {
                    saveToBackend();
                }, 800);
                return () => clearTimeout(timer);
            }, [programs, donations, expenses, auditLogs, contentItems, aboutContent, adminAccounts, appSettings, paymentGateway, chatMessages]);

            const handleAppSettingsChange = (field, value) => {
                setAppSettings(prev => ({ ...prev, [field]: value }));
            };

            const handleSaveAppSettings = () => {
                Object.assign(INSTITUTION_INFO, appSettings);
                showToast('Pengaturan aplikasi berhasil disimpan.');
            };

            const handleSavePaymentGateway = () => {
                const activeBankBsi = paymentGateway.banks.find(bank => bank.name === 'Bank BSI') || paymentGateway.banks[0];
                const activeBankMandiri = paymentGateway.banks.find(bank => bank.name === 'Bank Mandiri') || paymentGateway.banks[1] || paymentGateway.banks[0];
                Object.assign(INSTITUTION_INFO, {
                    bankBSI: activeBankBsi ? activeBankBsi.account : INSTITUTION_INFO.bankBSI,
                    bankMandiri: activeBankMandiri ? activeBankMandiri.account : INSTITUTION_INFO.bankMandiri,
                    qrisMerchant: paymentGateway.qrisLabel || INSTITUTION_INFO.qrisMerchant
                });
                showToast('Pengaturan payment gateway berhasil disimpan.');
            };

            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setPwaInstallPrompt(e);
                    setPwaInstallVisible(true);
                    if (pwaInstallTimerRef.current) clearTimeout(pwaInstallTimerRef.current);
                    pwaInstallTimerRef.current = setTimeout(() => {
                        setPwaInstallVisible(false);
                    }, 20000);
                };
                window.addEventListener('beforeinstallprompt', handler);
                return () => window.removeEventListener('beforeinstallprompt', handler);
            }, []);

            const handlePwaInstall = async () => {
                if (!pwaInstallPrompt) return;
                pwaInstallPrompt.prompt();
                const result = await pwaInstallPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    showToast('Aplikasi berhasil diinstall!');
                }
                setPwaInstallPrompt(null);
                setPwaInstallVisible(false);
                if (pwaInstallTimerRef.current) clearTimeout(pwaInstallTimerRef.current);
            };

            const handlePwaDismiss = () => {
                setPwaInstallVisible(false);
                if (pwaInstallTimerRef.current) clearTimeout(pwaInstallTimerRef.current);
            };

            useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash.replace('#', '');
                    if (hash === 'login') {
                        setCurrentView('login');
                    } else if (hash === 'admin' && isLoggedIn) {
                        setCurrentView('admin');
                    }
                };
                handleHash();
                window.addEventListener('hashchange', handleHash);
                return () => window.removeEventListener('hashchange', handleHash);
            }, [isLoggedIn]);

            const handleLogin = (e) => {
                e.preventDefault();
                const username = loginForm.username.trim();
                const password = loginForm.password.trim();
                const matchedAccount = adminAccounts.find(account =>
                    account.username.toLowerCase() === username.toLowerCase() && account.password === password
                );

                if (matchedAccount) {
                    setIsLoggedIn(true);
                    setAdminRole(matchedAccount.role);
                    setCurrentView('admin');
                    setLoginForm({ username: '', password: '' });
                    showToast(`Login berhasil. Selamat datang ${matchedAccount.name}.`);
                    return;
                }

                showToast('Username atau password salah.', 'error');
            };

            const handleResetAdminAccounts = () => {
                const confirmed = window.confirm('Reset semua akun admin ke pengaturan default?');
                if (!confirmed) return;
                setAdminAccounts(DEFAULT_ADMIN_ACCOUNTS);
                setIsLoggedIn(false);
                setCurrentView('login');
                showToast('Akun admin berhasil direset ke default.');
            };

            const handleAdminToggle = () => {
                if (!isLoggedIn) {
                    setCurrentView('login');
                    return;
                }

                setCurrentView(currentView === 'admin' ? 'home' : 'admin');
            };

            // Helper Show Toast
            const showToast = (msg, type = 'success') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            // Calculated Financial Statistics (Server-side simulation logic)
            const stats = useMemo(() => {
                const verifiedDonations = donations.filter(d => d.status === 'VERIFIED');
                const totalDonationsAmount = verifiedDonations.reduce((sum, d) => sum + d.amount, 0);
                const totalExpensesAmount = expenses.reduce((sum, e) => sum + e.amount, 0);
                const pendingCount = donations.filter(d => d.status === 'PENDING').length;
                const uniqueDonorsCount = new Set(verifiedDonations.map(d => d.donorEmail || d.donorName)).size;
                const activeProgramsCount = programs.filter(p => p.status === 'ACTIVE').length;

                return {
                    totalDonationsAmount,
                    totalExpensesAmount,
                    currentBalance: totalDonationsAmount - totalExpensesAmount,
                    pendingCount,
                    totalDonorsCount: uniqueDonorsCount + 124, // include historical count
                    activeProgramsCount,
                    totalVerifiedCount: verifiedDonations.length
                };
            }, [donations, expenses, programs]);

            // Calculate progress for each program
            const getProgramProgress = (programId) => {
                const program = programs.find(p => p.id === programId);
                if (!program) return { raised: 0, percentage: 0, count: 0 };
                
                const verifiedForProgram = donations.filter(d => d.programId === programId && d.status === 'VERIFIED');
                const raised = verifiedForProgram.reduce((sum, d) => sum + d.amount, 0);
                const percentage = Math.min(100, Math.round((raised / program.target) * 100));
                
                return {
                    raised,
                    percentage,
                    count: verifiedForProgram.length
                };
            };

            // Donasi Verification Handler
            const handleVerifyDonation = (donationId, approve, reason = '') => {
                const don = donations.find(d => d.id === donationId);
                if (!don) return;

                const newStatus = approve ? 'VERIFIED' : 'REJECTED';
                const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);

                setDonations(prev => prev.map(d => {
                    if (d.id === donationId) {
                        return {
                            ...d,
                            status: newStatus,
                            verifiedAt: nowStr,
                            verifiedBy: adminRole,
                            rejectReason: reason
                        };
                    }
                    return d;
                }));

                // Add Audit Log
                const actionName = approve ? 'VERIFY_DONATION' : 'REJECT_DONATION';
                const logEntry = {
                    id: `log-${Date.now()}`,
                    timestamp: nowStr,
                    user: adminRole,
                    action: actionName,
                    details: `${approve ? 'Memverifikasi' : 'Menolak'} donasi ${don.code} (${formatIDR(don.amount)}). ${reason ? 'Alasan: ' + reason : ''}`
                };
                setAuditLogs(prev => [logEntry, ...prev]);

                showToast(`Donasi ${don.code} berhasil ${approve ? 'DIVERIFIKASI' : 'DITOLAK'}.`, approve ? 'success' : 'error');
            };

            // Add New Donation Handler
            const handleCreateDonation = (donationPayload) => {
                const newCode = generateDonationCode();
                const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
                
                const newDonation = {
                    id: `don-${Date.now()}`,
                    code: newCode,
                    programId: donationPayload.programId,
                    donorName: donationPayload.isAnonymous ? "Hamba Allah" : donationPayload.donorName,
                    donorEmail: donationPayload.donorEmail,
                    donorPhone: donationPayload.donorPhone,
                    amount: Number(donationPayload.amount),
                    paymentMethod: donationPayload.paymentMethod,
                    status: "PENDING",
                    isAnonymous: donationPayload.isAnonymous,
                    notes: donationPayload.notes,
                    proofUrl: donationPayload.proofUrl || "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=400&q=80",
                    createdAt: nowStr,
                    verifiedAt: null,
                    verifiedBy: null
                };

                setDonations(prev => [newDonation, ...prev]);
                setDonationModalOpen(false);
                setSuccessDonationData(newDonation);

            const handleSendMessage = () => {
                if (!chatInput.trim()) return;
                const userMsg = { sender: 'user', text: chatInput };
                setChatMessages(prev => [...prev, userMsg]);
                setChatInput('');

                // Simulated automated friendly response
                setTimeout(() => {
                    setChatMessages(prev => [
                        ...prev,
                        { sender: 'system', text: 'Jazakallahu khairan atas pesan Anda. Customer Service Pondok Pesantren Hidayatullah Sorong akan membalas pesan Anda dalam kurun waktu 5-10 menit.' }

                                <button onClick={() => setCurrentView('programs')} className={`hover:text-brand-700 transition ${currentView === 'programs' ? 'text-brand-800 font-bold border-b-2 border-brand-700 py-1' : ''}`}>Program Donasi</button>
                                <button onClick={() => setCurrentView('berita')} className={`hover:text-brand-700 transition ${currentView === 'berita' ? 'text-brand-800 font-bold border-b-2 border-brand-700 py-1' : ''}`}>Berita</button>
                                <button onClick={() => setCurrentView('transparansi')} className={`hover:text-brand-700 transition ${currentView === 'transparansi' ? 'text-brand-800 font-bold border-b-2 border-brand-700 py-1' : ''}`}>Transparansi</button>
                                <button onClick={() => setCurrentView('cek-donasi')} className={`hover:text-brand-700 transition ${currentView === 'cek-donasi' ? 'text-brand-800 font-bold border-b-2 border-brand-700 py-1' : ''}`}>Cek Donasi</button>
                                <button onClick={() => setCurrentView('tentang')} className={`hover:text-brand-700 transition ${currentView === 'tentang' ? 'text-brand-800 font-bold border-b-2 border-brand-700 py-1' : ''}`}>Tentang Kami</button>
                                <button onClick={() => setCurrentView('kontak')} className={`hover:text-brand-700 transition ${currentView === 'kontak' ? 'text-brand-800 font-bold border-b-2 border-brand-700 py-1' : ''}`}>Kontak</button>
                            </nav>

                            {/* Header Actions */}
                            <div className="flex items-center gap-3">
                                <button

                                        setSelectedProgramForDonation(programs[0]);
                                        setDonationModalOpen(true);

                                >
                                    <i className="fas fa-heart text-gold-400"></i>
                                    <span>Donasi Sekarang</span>
                                </button>

                                {/* Admin Switcher Button */}
                                <button

                                >
                                    <i className="fas fa-user-shield"></i>
                                    <span>{currentView === 'admin' ? 'Kembali ke Web' : 'Dashboard Admin'}</span>
                                    {stats.pendingCount > 0 && currentView !== 'admin' && (
                                        <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold animate-pulse">
                                            {stats.pendingCount}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN VIEW CONTENT */}
                    <main className="flex-grow">
                        {currentView === 'home' && (
                            <HomeView 
                                programs={programs} 
                                stats={stats} 
                                getProgramProgress={getProgramProgress}
                                appSettings={appSettings}
                                onSelectProgram={(slug) => { setSelectedProgramSlug(slug); setCurrentView('program-detail'); }}
                                onStartDonation={(prog) => { setSelectedProgramForDonation(prog); setDonationModalOpen(true); }}
                                onNavigate={(view) => setCurrentView(view)}
                            />

                        {currentView === 'programs' && (
                            <ProgramsListView

                                getProgramProgress={getProgramProgress}
                                onSelectProgram={(slug) => { setSelectedProgramSlug(slug); setCurrentView('program-detail'); }}
                                onStartDonation={(prog) => { setSelectedProgramForDonation(prog); setDonationModalOpen(true); }}

                        {currentView === 'program-detail' && (

                                getProgramProgress={getProgramProgress}

                                onShare={(prog) => setShareModalData(prog)}
                                onBack={() => setCurrentView('programs')}
                            />
                        )}

                        {currentView === 'transparansi' && (
                            <TransparansiView 
                                stats={stats} 
                                programs={programs} 
                                expenses={expenses}
                                donations={donations}
                            />

                        {currentView === 'cek-donasi' && (
                            <CekDonasiView donations={donations} programs={programs} />

                        {currentView === 'tentang' && <TentangKamiView aboutContent={aboutContent} />}
                        {currentView === 'berita' && <BeritaView contentItems={contentItems} onSelectNews={(id) => { setSelectedNewsId(id); setCurrentView('berita-detail'); }} isLoggedIn={isLoggedIn} adminRole={adminRole} onEditNews={(item) => { handleEditContent(item); setAdminActiveTab('content'); setCurrentView('admin'); }} onDeleteNews={(id) => handleDeleteContent(id)} />}
                        {currentView === 'berita-detail' && selectedNewsId && (

                                selectedNewsId={selectedNewsId} 
                                onBack={() => setCurrentView('berita')} 
                                isLoggedIn={isLoggedIn}
                                adminRole={adminRole}
                                onEditNews={(item) => { handleEditContent(item); setAdminActiveTab('content'); setCurrentView('admin'); }}
                                onDeleteNews={(id) => handleDeleteContent(id)}
                            />
                        )}
                        {currentView === 'kontak' && <KontakView />}
                        {currentView === 'login' && (
                            <LoginView 
                                loginForm={loginForm}
                                setLoginForm={setLoginForm}
                                onLogin={handleLogin}
                                onBack={() => setCurrentView('home')}
                            />
                        )}

                        {currentView === 'admin' && isLoggedIn ? (
                            <AdminDashboardView 
                                stats={stats}
                                programs={programs}
                                setPrograms={setPrograms}
                                donations={donations}
                                expenses={expenses}
                                setExpenses={setExpenses}
                                auditLogs={auditLogs}
                                adminRole={adminRole}
                                setAdminRole={setAdminRole}
                                appSettings={appSettings}
                                onAppSettingsChange={handleAppSettingsChange}
                                onSaveAppSettings={handleSaveAppSettings}
                                paymentGateway={paymentGateway}
                                setPaymentGateway={setPaymentGateway}
                                onSavePaymentGateway={handleSavePaymentGateway}
                                activeTab={adminActiveTab}
                                setActiveTab={setAdminActiveTab}
                                onVerify={handleVerifyDonation}
                                getProgramProgress={getProgramProgress}
                                showToast={showToast}
                                contentItems={contentItems}
                                setContentItems={setContentItems}
                                aboutContent={aboutContent}
                                setAboutContent={setAboutContent}
                                adminAccounts={adminAccounts}
                                setAdminAccounts={setAdminAccounts}
                                onResetAdminAccounts={handleResetAdminAccounts}
                                chatMessages={chatMessages}
                                setChatMessages={setChatMessages}
                                adminChatEndRef={adminChatEndRef}
                            />
                        ) : null}

                        {currentView === 'admin' && !isLoggedIn && (
                            <LoginView 
                                loginForm={loginForm}
                                setLoginForm={setLoginForm}
                                onLogin={handleLogin}
                                onBack={() => setCurrentView('home')}
                            />
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="bg-brand-900 text-white pt-16 pb-12 border-t-4 border-gold-500 mt-20">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-10">
                            {/* Col 1: About */}
                            <div className="md:col-span-2">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-10 h-10 rounded-xl bg-gold-500 text-brand-900 flex items-center justify-center font-bold text-lg">
                                        <i className="fas fa-kaaba"></i>
                                    </div>

                                        <h3 className="font-extrabold text-lg text-white">{INSTITUTION_INFO.appName}</h3>

        function ShareProgramModal({ program, onClose }) {
            const resolvedOrigin = typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin !== 'null'
                ? window.location.origin
                : 'https://hidayatullahpeduli-sorong.org';
            const shareUrl = (() => {
                try {
                    return new URL(`/program/${program.slug}`, resolvedOrigin).toString();
                } catch (error) {
                    return `https://hidayatullahpeduli-sorong.org/program/${program.slug}`;
                }
            })();
            const [copied, setCopied] = useState(false);

            const handleCopy = async () => {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(shareUrl);
                    } else {
                        const textArea = document.createElement('textarea');
                        textArea.value = shareUrl;
                        textArea.style.position = 'fixed';
                        textArea.style.opacity = '0';
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    setCopied(true);
                    setTimeout(() => setCopied(false), 3000);
                } catch (error) {
                    window.prompt('Salin link program ini:', shareUrl);
                }
            };

            const handleNativeShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: program.title,
                            text: `Mari bantu program: ${program.title}`,
                            url: shareUrl,
                        });
                        onClose();
                        return;
                    } catch (error) {

                                                <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full font-bold">Live Update</span>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Nama Aplikasi</label>
                                                    <input
                                                        type="text"
                                                        value={appSettings.appName}
                                                        onChange={(e) => onAppSettingsChange('appName', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Nama Institusi</label>
                                                    <input
                                                        type="text"
                                                        value={appSettings.name}
                                                        onChange={(e) => onAppSettingsChange('name', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div className="md:col-span-2 space-y-2">
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Foto Hero Section</label>
                                                    <input
                                                        type="file"
                                                        accept="image/*"
                                                        onChange={(e) => {
                                                            const file = e.target.files && e.target.files[0];
                                                            if (!file) return;
                                                            const reader = new FileReader();
                                                            reader.onload = () => onAppSettingsChange('heroImage', reader.result);
                                                            reader.readAsDataURL(file);
                                                        }}
                                                        className="w-full p-2 border rounded-xl bg-gray-50"
                                                    />
                                                    <input
                                                        type="url"
                                                        value={appSettings.heroImage || ''}
                                                        onChange={(e) => onAppSettingsChange('heroImage', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                        placeholder="https://example.com/hero-image.jpg"
                                                    />
                                                    {appSettings.heroImage && (
                                                        <img src={appSettings.heroImage} alt="Preview hero section" className="w-full h-32 object-cover rounded-xl border border-gray-200" />
                                                    )}
                                                </div>

                                                <div className="md:col-span-2 space-y-3">
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Logo Aplikasi</label>
                                                    <input
                                                        type="file"
                                                        accept="image/*"
                                                        onChange={(e) => {
                                                            const file = e.target.files && e.target.files[0];
                                                            if (!file) return;
                                                            const reader = new FileReader();
                                                            reader.onload = () => onAppSettingsChange('logo', reader.result);
                                                            reader.readAsDataURL(file);
                                                        }}
                                                        className="w-full p-2 border rounded-xl bg-gray-50"
                                                    />
                                                    <input
                                                        type="url"
                                                        value={appSettings.logo || ''}
                                                        onChange={(e) => onAppSettingsChange('logo', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                        placeholder="https://example.com/logo.png"
                                                    />
                                                    {appSettings.logo && (
                                                        <img src={appSettings.logo} alt="Preview logo aplikasi" className="w-20 h-20 object-cover rounded-2xl border border-gray-200" />
                                                    )}
                                                </div>

                                                <div className="md:col-span-2">
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Tagline</label>
                                                    <input
                                                        type="text"
                                                        value={appSettings.tagline}
                                                        onChange={(e) => onAppSettingsChange('tagline', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Kontak WhatsApp</label>
                                                    <input
                                                        type="text"
                                                        value={appSettings.phone}
                                                        onChange={(e) => onAppSettingsChange('phone', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Email</label>
                                                    <input
                                                        type="email"
                                                        value={appSettings.email}
                                                        onChange={(e) => onAppSettingsChange('email', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div className="md:col-span-2">
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Alamat</label>
                                                    <textarea
                                                        rows="3"
                                                        value={appSettings.address}
                                                        onChange={(e) => onAppSettingsChange('address', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Link Facebook</label>
                                                    <input
                                                        type="url"
                                                        value={appSettings.facebookUrl || ''}
                                                        onChange={(e) => onAppSettingsChange('facebookUrl', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                        placeholder="https://facebook.com/..."
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Link Instagram</label>
                                                    <input
                                                        type="url"
                                                        value={appSettings.instagramUrl || ''}
                                                        onChange={(e) => onAppSettingsChange('instagramUrl', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                        placeholder="https://instagram.com/..."
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Link YouTube</label>
                                                    <input
                                                        type="url"
                                                        value={appSettings.youtubeUrl || ''}
                                                        onChange={(e) => onAppSettingsChange('youtubeUrl', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                        placeholder="https://youtube.com/..."
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Link TikTok</label>
                                                    <input
                                                        type="url"
                                                        value={appSettings.tiktokUrl || ''}
                                                        onChange={(e) => onAppSettingsChange('tiktokUrl', e.target.value)}
                                                        className="w-full p-3 border rounded-xl"
                                                        placeholder="https://tiktok.com/@..."
                                                    />
                                                </div>
                                            </div>

                                            <button
                                                type="button"
                                                onClick={onSaveAppSettings}
                                                className="w-full bg-brand-800 text-gold-300 py-3 rounded-xl font-bold hover:bg-brand-900 transition"
                                            >
                                                Save
                                            </button>
                                        </div>

                                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 space-y-6">
                                            <div className="flex items-center justify-between">
                                                <h3 className="font-bold text-sm text-brand-900">Payment Gateway</h3>
                                                <span className="text-[10px] bg-brand-50 text-brand-800 px-2 py-1 rounded-full font-bold">Bank + QRIS</span>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Metode Default</label>
                                                    <select
                                                        value={paymentGateway.defaultMethod}
                                                        onChange={(e) => setPaymentGateway(prev => ({ ...prev, defaultMethod: e.target.value }))}
                                                        className="w-full p-3 border rounded-xl"
                                                    >
                                                        {paymentGateway.banks.map(bank => (
                                                            <option key={bank.id} value={bank.name}>{bank.name}</option>
                                                        ))}
                                                        <option value="QRIS">QRIS</option>
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Label QRIS</label>
                                                    <input
                                                        type="text"
                                                        value={paymentGateway.qrisLabel}
                                                        onChange={(e) => setPaymentGateway(prev => ({ ...prev, qrisLabel: e.target.value }))}
                                                        className="w-full p-3 border rounded-xl"
                                                    />
                                                </div>
                                            </div>

                                            <div className="space-y-3">
                                                <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Upload QRIS</label>
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={(e) => {
                                                        const file = e.target.files && e.target.files[0];
                                                        if (!file) return;
                                                        const reader = new FileReader();
                                                        reader.onload = () => {
                                                            setPaymentGateway(prev => ({ ...prev, qrisImage: reader.result }));
                                                        };
                                                        reader.readAsDataURL(file);
                                                    }}
                                                    className="w-full p-2 border rounded-xl bg-gray-50"
                                                />
                                                <input
                                                    type="url"
                                                    value={paymentGateway.qrisImage}
                                                    onChange={(e) => setPaymentGateway(prev => ({ ...prev, qrisImage: e.target.value }))}
                                                    className="w-full p-3 border rounded-xl"
                                                    placeholder="https://example.com/qris.png"
                                                />
                                                {paymentGateway.qrisImage && (
                                                    <img src={paymentGateway.qrisImage} alt="Preview QRIS" className="w-32 h-32 object-cover rounded-xl border border-gray-200" />
                                                )}
                                            </div>

                                            <div className="space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <h4 className="font-bold text-xs text-brand-900">Daftar Rekening Bank</h4>
                                                    <span className="text-[10px] text-gray-500">{paymentGateway.banks.length} data</span>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                                                    <input
                                                        type="text"
                                                        value={bankForm.name}
                                                        onChange={(e) => setBankForm(prev => ({ ...prev, name: e.target.value }))}
                                                        placeholder="Nama bank"
                                                        className="p-3 border rounded-xl"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={bankForm.account}
                                                        onChange={(e) => setBankForm(prev => ({ ...prev, account: e.target.value }))}
                                                        placeholder="Nomor rekening"
                                                        className="p-3 border rounded-xl"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={bankForm.holder}
                                                        onChange={(e) => setBankForm(prev => ({ ...prev, holder: e.target.value }))}
                                                        placeholder="Atas nama"
                                                        className="p-3 border rounded-xl"
                                                    />
                                                </div>

                                                <div className="flex gap-3">
                                                    <button
                                                        type="button"
                                                        onClick={handleSaveBank}
                                                        className="flex-1 bg-brand-800 text-gold-300 py-2.5 rounded-xl font-bold"
                                                    >
                                                        {bankForm.id ? 'Update Bank' : 'Tambah Bank'}
                                                    </button>
                                                    {bankForm.id && (
                                                        <button
                                                            type="button"
                                                            onClick={() => setBankForm({ id: '', name: '', account: '', holder: '' })}
                                                            className="px-4 py-2.5 rounded-xl bg-gray-200 text-gray-700 font-bold"
                                                        >
                                                            Batal
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="space-y-2">
                                                    {paymentGateway.banks.map(bank => (
                                                        <div key={bank.id} className="flex items-center justify-between gap-3 border border-gray-200 rounded-xl p-3">
                                                            <div>
                                                                <p className="font-bold text-gray-800">{bank.name}</p>
                                                                <p className="text-[10px] text-gray-500">{bank.account}</p>
                                                                <p className="text-[10px] text-gray-400">{bank.holder || 'Tanpa nama'}</p>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleEditBank(bank)}
                                                                    className="px-2.5 py-1.5 rounded-lg text-[10px] font-bold bg-amber-100 text-amber-700"
                                                                >
                                                                    Edit
                                                                </button>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleDeleteBank(bank.id)}
                                                                    className="px-2.5 py-1.5 rounded-lg text-[10px] font-bold bg-red-100 text-red-700"
                                                                >
                                                                    Hapus
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <button
                                                type="button"
                                                onClick={onSavePaymentGateway}
                                                className="w-full bg-brand-800 text-gold-300 py-3 rounded-xl font-bold hover:bg-brand-900 transition"
                                            >
                                                Save Payment Gateway
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* TAB: LIVE CHAT MANAGEMENT */}
                        {activeTab === 'chat' && (
                            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 space-y-4">
                                <h3 className="font-bold text-sm text-brand-900">Live Chat Management</h3>
                                <p className="text-xs text-gray-500">Balas pesan dari pengunjung yang mengirimkan chat melalui website.</p>
                                <div className="bg-gray-50 rounded-2xl border border-gray-200 p-4 max-h-[500px] overflow-y-auto space-y-3">
                                    {chatMessages.length === 0 ? (
                                        <p className="text-xs text-gray-500 italic">Belum ada pesan chat.</p>
                                    ) : (
                                        chatMessages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[80%] rounded-2xl p-3 ${msg.sender === 'user' ? 'bg-brand-800 text-white rounded-br-none' : msg.sender === 'admin' ? 'bg-emerald-50 border border-emerald-200 text-gray-800 rounded-bl-none' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-none shadow-sm'}`}>
                                                    <p className="text-[10px] font-bold uppercase mb-1 text-emerald-700">{msg.sender === 'user' ? 'Pengunjung' : msg.sender === 'admin' ? (msg.role ? `Admin ${msg.role}` : 'Admin') : 'System'}</p>
                                                    <p className="text-xs">{msg.text}</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                    <div ref={adminChatEndRef} />
                                </div>
                                <div className="flex items-center gap-2 pt-2">
                                    <input
                                        type="text"
                                        value={adminChatInput}
                                        onChange={(e) => setAdminChatInput(e.target.value)}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                const text = adminChatInput.trim();
                                                if (!text) return;
                                                const reply = { sender: 'admin', text, role: adminRole };
                                                setChatMessages(prev => [...prev, reply]);
                                                setAdminChatInput('');
                                            }
                                        }}
                                        placeholder="Ketik balasan untuk pengunjung..."
                                        className="flex-grow text-xs border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:border-brand-700"
                                    />
                                    <button
                                        onClick={() => {
                                            const text = adminChatInput.trim();
                                            if (!text) return;
                                            const reply = { sender: 'admin', text, role: adminRole };
                                            setChatMessages(prev => [...prev, reply]);
                                            setAdminChatInput('');
                                        }}
                                        className="bg-brand-800 text-gold-400 p-2 rounded-xl hover:bg-brand-900 transition"
                                    >
                                        <i className="fas fa-paper-plane text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((registration) => {
                    console.log('SW registered: ', registration);
                }).catch((registrationError) => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
